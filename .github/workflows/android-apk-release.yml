name: Android APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PUBLIC_AUTH_BASE_URL: ${{ secrets.VITE_PUBLIC_AUTH_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_ANDROID_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_ANDROID_WEB_CLIENT_ID }}
          VITE_GOOGLE_WEB_CALLBACK_ALLOWED_ORIGINS: ${{ secrets.VITE_GOOGLE_WEB_CALLBACK_ALLOWED_ORIGINS }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK artifact
        id: apk
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          VERSION_CODE=$(grep 'versionCode ' android/app/build.gradle | grep -o '[0-9]*')
          VERSIONED_NAME="rampxtrading_v${VERSION_NAME}_build${VERSION_CODE}_debug.apk"
          mkdir -p release
          cp "android/app/build/outputs/apk/debug/${VERSIONED_NAME}" "release/${VERSIONED_NAME}"
          cp "release/${VERSIONED_NAME}" release/rampxtrading-latest.apk
          echo "versioned_name=${VERSIONED_NAME}" >> $GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.versioned_name }}
          path: release/${{ steps.apk.outputs.versioned_name }}
          if-no-files-found: error

      - name: Publish latest-android release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: RampX Trading Android (Latest)
          files: |
            release/${{ steps.apk.outputs.versioned_name }}
            release/rampxtrading-latest.apk
          make_latest: true
          overwrite_files: true
          generate_release_notes: false
